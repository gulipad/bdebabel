<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<script>
			// The bare cover opens in the reader's language: their own choice if they made one on the cover (ES · EN),
			// else the first of their browser's languages that is Spanish (or Catalan, Galician, Basque) or English;
			// any other, English. Only "/" is redirected: a link to a page, a room or the English cover is followed as is.
			(function () {
				if (location.pathname !== '/') return;
				var pick = null;
				try {
					pick = localStorage.getItem('babel:lang');
				} catch (e) {}
				if (!pick) {
					pick = 'en';
					var ls =
						navigator.languages && navigator.languages.length
							? navigator.languages
							: [navigator.language || ''];
					for (var i = 0; i < ls.length; i++) {
						var l = String(ls[i]).toLowerCase().slice(0, 2);
						if (l === 'es' || l === 'ca' || l === 'gl' || l === 'eu') {
							pick = 'es';
							break;
						}
						if (l === 'en') break;
					}
				}
				if (pick === 'en') location.replace('/en' + location.search + location.hash);
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#efe0bf" />
		<meta
			name="description"
			content="La Biblioteca de Babel: cada página de 3.200 caracteres tiene su dirección, y las legibles viven cerca del centro."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="La Biblioteca de Babel" />
		<meta property="og:title" content="La Biblioteca de Babel" />
		<meta
			property="og:description"
			content="La Biblioteca de Babel de Borges, en español, con un modelo de lenguaje como cartógrafo."
		/>
		<meta property="og:url" content="https://babel.gulipad.com/" />
		<meta property="og:locale" content="es_ES" />
		<meta property="og:image" content="https://babel.gulipad.com/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="La Biblioteca de Babel: una ciudad de salas hexagonales dibujadas a tinta"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="La Biblioteca de Babel" />
		<meta
			name="twitter:description"
			content="La Biblioteca de Babel de Borges, en español, con un modelo de lenguaje como cartógrafo."
		/>
		<meta name="twitter:image" content="https://babel.gulipad.com/og.jpg" />
		<meta
			name="twitter:image:alt"
			content="La Biblioteca de Babel: una ciudad de salas hexagonales dibujadas a tinta"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IBM+Plex+Mono&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
